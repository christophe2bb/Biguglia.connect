name: Recette authentifiée artisan et messagerie

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artisan-contact:
    name: Deux comptes réels de test — contacter un artisan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://biguglia-connect.vercel.app
      STRICT_E2E: 'true'
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_ARTISAN_ID: ${{ secrets.E2E_ARTISAN_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier que la recette utilise de vrais comptes isolés
        run: |
          if [ -z "$E2E_TEST_EMAIL" ] || [ -z "$E2E_TEST_PASSWORD" ] || [ -z "$E2E_ARTISAN_ID" ]; then
            echo "::error::Recette authentifiée non exécutée : configurer E2E_TEST_EMAIL, E2E_TEST_PASSWORD et E2E_ARTISAN_ID. Le succès des tests anonymes ne suffit pas."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Exécuter le parcours complet sur le domaine officiel
        run: npx playwright test e2e/critical-artisan-contact.spec.ts --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: recette-artisan-echec
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
