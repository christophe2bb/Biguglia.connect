name: Services — base Supabase locale isolée

# Recette sans utilisation d'un projet Supabase hébergé ni facturation Pro.
# Toutes les données sont créées sur un runner GitHub éphémère et détruites.
on:
  pull_request:
    paths:
      - '.github/workflows/services-qa-local-supabase.yml'
      - 'supabase/migrations/**'
      - 'e2e/services-roles.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-db:
    name: Vérifier la reconstruction Supabase en environnement isolé
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialiser un projet uniquement local
        run: supabase init --force
      - name: Fournir le schéma initial uniquement au runner éphémère
        run: |
          # Le snapshot 2026-04-07 précède les migrations incrémentales.
          # Ne jamais committer ce fichier sous supabase/migrations :
          # une base Supabase de production existante ne doit pas le réappliquer.
          cp docs/db/schema.sql supabase/migrations/20260406_initial_schema.sql
          # Index transversaux datés trop tôt : asso_comments est créé après
          # le 07/04. Réordonner uniquement dans cet espace de QA éphémère,
          # après les migrations de création des tables et avant les correctifs
          # de sécurité de novembre.
          mv supabase/migrations/20260407_baseline_rls_indexes.sql \
             supabase/migrations/20261110000000_baseline_rls_indexes.sql
      - name: Reconstruire la base avec le schéma initial puis les migrations GitHub
        run: supabase start
      - name: Vérifier que Auth et la base répondent en local
        run: |
          curl --fail --silent --show-error http://127.0.0.1:54321/auth/v1/health > /dev/null
          supabase db lint --local --level warning || true
          echo 'Supabase isolé démarré : aucune donnée de production copiée'
      - name: Nettoyer la base temporaire
        if: always()
        run: supabase stop --no-backup || true
